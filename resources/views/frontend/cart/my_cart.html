<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/my_cart.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <main class="cart-page">
        <h1 class="cart-page_title">Cart</h1>
 
        <nav class="stepper">
            <div class="cart-stepper">
                <div class="stepper-active">
                    <span class="stepper-number">1</span>
                    <span class="stepper-text">Shopping cart</span>
                </div>
                <div class="stepper-item">
                    <span class="stepper-number">2</span>
                    <span class="stepper-text">Checkout details</span>
                </div>
                <div class="stepper-item">
                    <span class="stepper-number">3</span>
                    <span class="stepper-text">Order complete</span>
                </div>
            </div>
        </nav>
        <div class="cart-container">
            <section class="cart-items">
                <h2 class="cart-items-heading">Games on the Cart</h2>
               
                <div class="cart-items-list">
                    <article class="cart-item">
                        <div class="cart-item-image-placeholder">
                            <img src="/img/hollow_knight.png" alt="Hollow Knight">
                        </div>
                        <div class="cart-item-details">
                            <h3 class="cart-item-name">Hollow Knight (STEAM)</h3>
                            <div class="cart-item-prices">
                                <span class="cart-item-price-original">$99.99</span>
                                <span class="cart-item-price-discount">$99.99</span>
                            </div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="cart-item-remove-btn">Remove</button>
                            <span class="cart-item-total">$25.98</span>
                        </div>
                    </article>
                    </div>
            </section>
 
            <aside class="order-summary">
                <h2 class="order-summary-title">Order Summary</h2>
               
                <div class="order-summary-row">
                    <span>Items total</span>
                    <span>$128.78</span>
                </div>
                <div class="order-summary-row">
                    <span>Items quantity</span>
                    <span>$128.78</span>
                </div>
               
                <hr class="order-summary-divider">
 
                <div class="order-summary-total-row">
                    <span>Subtotal</span>
                    <span>$134.56</span>
                </div>
 
                <button class="checkout-button">
                    <span class="checkout-button-icon">💳</span>
                    <span class="checkout-button-text">Checkout</span>
                    <span class="checkout-button-amount">$134.56</span>
                </button>
            </aside>
        </div>
 
        <section class="you-may-like">
        <h2>You may like</h2>
        <div class="you-may-like-container">
            <article class="game-card">
                <div class="game-cover">
                <img src="/img/replaced-banner.png" alt="Replaced">
                </div>
                <div class="game-info">
                    <h4 class="game-title">REPLACED</h4>
                    <div class="price-row">
                    <span class="discount">-60%</span>
                    <span class="old-price">$40.00</span>
                    <span class="new-price">$24.00</span>
                    </div>
                </div>
            </article>
            <article class="game-card">
                <div class="game-cover">
                <img src="/img/replaced-banner.png" alt="Aerial Knight">
                </div>
                <div class="game-info">
                    <h4 class="game-title">Aerial_Knight's</h4>
                    <div class="price-row">
                        <span class="discount">-60%</span>
                        <span class="old-price">$40.00</span>
                        <span class="new-price">$24.00</span>
                    </div>
                </div>
            </article>
            <article class="game-card">
                <div class="game-cover">
                    <img src="/img/replaced-banner.png" alt="Big Hops">
                </div>
                <div class="game-info">
                    <h4 class="game-title">Big Hops</h4>
                    <div class="price-row">
                        <span class="new-price">$19.00</span>
                    </div>
                </div>
            </article>
        </div>
    </section>
    </main>
</body>
</html>
